<!DOCTYPE html>
<html>

<head>
    <title>WASM Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }

        .success {
            color: green;
        }

        .error {
            color: red;
        }

        .info {
            color: blue;
        }

        .test-section {
            margin: 15px 0;
            padding: 10px;
            border-left: 3px solid #ccc;
        }

        #output {
            margin-top: 20px;
            padding: 10px;
            border: 1px solid #ccc;
        }
    </style>
</head>

<body>
    <h1>WebAssembly Test Runner</h1>
    <button onclick="runAdvancedTests()">Run Advanced Tests</button>
    <div id="output">Click button to run tests...</div>

    <script>
        async function runWASMTest() {
            const output = document.getElementById('output');
            output.innerHTML = '';

            try {
                output.innerHTML += '<div class="info">Loading WASM module...</div>';

                // Load and instantiate the WASM module
                const response = await fetch('output.wasm');
                const bytes = await response.arrayBuffer();
                const results = await WebAssembly.instantiate(bytes);
                const instance = results.instance;

                output.innerHTML += '<div class="success">WASM module loaded successfully!</div>';

                // Test 1: Check if functions exist
                output.innerHTML += '<div class="info">Testing exported functions...</div>';

                const requiredExports = ['_start', 'get_heap_size', 'create_integer', 'create_boolean', 'create_list'];
                for (const exp of requiredExports) {
                    if (typeof instance.exports[exp] !== 'function') {
                        throw new Error(`${exp} function not found`);
                    }
                    output.innerHTML += `<div class="success">${exp} function found</div>`;
                }

                // Test 2: Check initial heap state
                const initialHeap = instance.exports.get_heap_size();
                output.innerHTML += `<div class="info">Initial heap size: ${initialHeap} bytes</div>`;

                // Test 3: Run the main program
                output.innerHTML += '<div class="info">Executing program (_start)...</div>';
                instance.exports._start();
                output.innerHTML += '<div class="success">Program executed successfully</div>';

                // Test 4: Check heap usage after execution
                const finalHeap = instance.exports.get_heap_size();
                output.innerHTML += `<div class="info">Final heap size: ${finalHeap} bytes</div>`;

                // Test 5: Calculate memory used
                const memoryUsed = finalHeap - initialHeap;
                output.innerHTML += `<div class="info">Memory allocated during execution: ${memoryUsed} bytes</div>`;

                // Test 6: Check if memory was actually used
                if (memoryUsed > 0) {
                    output.innerHTML += '<div class="success">Memory allocation detected - objects were created</div>';
                } else {
                    output.innerHTML += '<div class="error">⚠ No memory allocation detected</div>';
                }

                // Test 7: Check WebAssembly Memory
                if (instance.exports.memory) {
                    const memory = instance.exports.memory;
                    output.innerHTML += `<div class="info">WebAssembly Memory: ${memory.buffer.byteLength} bytes total</div>`;
                }

                // Final summary
                output.innerHTML += '<div class="success"><br><strong>All tests completed successfully!</strong></div>';
                output.innerHTML += `<div class="info">Program executed and allocated ${memoryUsed} bytes of memory.</div>`;

                return instance;

            } catch (error) {
                console.error('Error:', error);
                output.innerHTML = `<div class="error">Error: ${error.message}</div>`;
                throw error;
            }
        }

        async function runAdvancedTests() {
            const instance = await runWASMTest();
            const output = document.getElementById('output');

            try {
                output.innerHTML += '<div class="info"><br>Running advanced tests...</div>';

                // Test object creation
                const intObj = instance.exports.create_integer(42);
                const intObj2 = instance.exports.create_integer(100);
                const realObj = instance.exports.create_real(3.14);
                const boolObj = instance.exports.create_boolean(1);

                output.innerHTML += `<div class="success">Integer object created at address: ${intObj}</div>`;
                output.innerHTML += `<div class="success">Real object created at address: ${realObj}</div>`;
                output.innerHTML += `<div class="success">Boolean object created at address: ${boolObj}</div>`;

                // Test values
                const intValue = instance.exports.get_integer_value(intObj);
                const boolValue = instance.exports.get_boolean_value(boolObj);

                output.innerHTML += `<div class="success">Integer value: ${intValue} (expected: 42)</div>`;
                output.innerHTML += `<div class="success">Boolean value: ${boolValue} (expected: 1)</div>`;

                // Test operations
                const sumResult = instance.exports['Integer.Plus_Integer'](intObj, intObj2);
                const sumValue = instance.exports.get_integer_value(sumResult);
                output.innerHTML += `<div class="success">42 + 100 = ${sumValue} (expected: 142)</div>`;

                // Test Array functionality
                output.innerHTML += '<div class="test-section"><strong>Testing Array functionality...</strong></div>';

                const arrayObj = instance.exports.create_array(3);
                output.innerHTML += `<div class="success">Array created at address: ${arrayObj}</div>`;

                // Set array elements
                instance.exports['Array.set'](arrayObj, 0, intObj);
                instance.exports['Array.set'](arrayObj, 1, intObj2);
                instance.exports['Array.set'](arrayObj, 2, intObj);

                // Get array length
                const arrayLength = instance.exports['Array.Length'](arrayObj);
                const arrayLengthValue = instance.exports.get_integer_value(arrayLength);
                output.innerHTML += `<div class="success">Array length: ${arrayLengthValue} (expected: 3)</div>`;

                // Get array element
                const arrayElement = instance.exports['Array.get'](arrayObj, 1);
                const arrayElementValue = instance.exports.get_integer_value(arrayElement);
                output.innerHTML += `<div class="success">Array element at index 1: ${arrayElementValue} (expected: 100)</div>`;

                // Test List functionality
                output.innerHTML += '<div class="test-section"><strong>Testing List functionality...</strong></div>';

                // Test empty list
                const emptyList = instance.exports.create_list();
                instance.exports['List.constructor0'](emptyList);
                const emptyListSize = instance.exports['List.size'](emptyList);
                const emptyListSizeValue = instance.exports.get_integer_value(emptyListSize);
                const emptyListIsEmpty = instance.exports['List.isEmpty'](emptyList);
                const emptyListIsEmptyValue = instance.exports.get_boolean_value(emptyListIsEmpty);

                output.innerHTML += `<div class="success">Empty list created at address: ${emptyList}</div>`;
                output.innerHTML += `<div class="success">Empty list size: ${emptyListSizeValue} (expected: 0)</div>`;
                output.innerHTML += `<div class="success">Empty list isEmpty: ${emptyListIsEmptyValue} (expected: 1)</div>`;

                // Test list with single element
                const singleList = instance.exports.create_list();
                instance.exports['List.constructor1'](singleList, intObj);
                const singleListSize = instance.exports['List.size'](singleList);
                const singleListSizeValue = instance.exports.get_integer_value(singleListSize);
                const singleListHead = instance.exports['List.head'](singleList);
                const singleListHeadValue = instance.exports.get_integer_value(singleListHead);

                output.innerHTML += `<div class="success">Single-element list created at address: ${singleList}</div>`;
                output.innerHTML += `<div class="success">Single-element list size: ${singleListSizeValue} (expected: 1)</div>`;
                output.innerHTML += `<div class="success">Single-element list head: ${singleListHeadValue} (expected: 42)</div>`;

                // Test list append
                instance.exports['List.append'](singleList, intObj2);
                const appendedListSize = instance.exports['List.size'](singleList);
                const appendedListSizeValue = instance.exports.get_integer_value(appendedListSize);
                output.innerHTML += `<div class="success">After append, list size: ${appendedListSizeValue} (expected: 2)</div>`;

                // Test list tail
                const tailList = instance.exports['List.tail'](singleList);
                const tailListSize = instance.exports['List.size'](tailList);
                const tailListSizeValue = instance.exports.get_integer_value(tailListSize);
                output.innerHTML += `<div class="success">Tail list size: ${tailListSizeValue} (expected: 1)</div>`;

                // Test list with multiple elements
                const multiList = instance.exports.create_list();
                instance.exports['List.constructor2'](multiList, intObj2, 3);
                const multiListSize = instance.exports['List.size'](multiList);
                const multiListSizeValue = instance.exports.get_integer_value(multiListSize);
                const multiListHead = instance.exports['List.head'](multiList);
                const multiListHeadValue = instance.exports.get_integer_value(multiListHead);

                output.innerHTML += `<div class="success">Multi-element list created at address: ${multiList}</div>`;
                output.innerHTML += `<div class="success">Multi-element list size: ${multiListSizeValue} (expected: 3)</div>`;
                output.innerHTML += `<div class="success">Multi-element list head: ${multiListHeadValue} (expected: 100)</div>`;

                output.innerHTML += '<div class="success"><br><strong>Advanced tests completed successfully!</strong></div>';

                const ptr = instance.exports.main();
                const main = instance.exports.getInt(ptr);
                output.innerHTML += `<div class="success">Main run without errors: ${main} (expected )</div>`;
            } catch (error) {
                console.error('Full error details:', error);
        console.error('Error stack:', error.stack);
        console.error('Error name:', error.name);
        console.error('Error message:', error.message);
        
        // Check for WebAssembly compilation/instantiation errors
        if (error instanceof WebAssembly.CompileError) {
            console.error('WebAssembly CompileError:', error);
            output.innerHTML += `<div class="error">Compile Error: ${error.message}</div>`;
        } else if (error instanceof WebAssembly.LinkError) {
            console.error('WebAssembly LinkError:', error);
            output.innerHTML += `<div class="error">Link Error: ${error.message}</div>`;
        } else if (error instanceof WebAssembly.RuntimeError) {
            console.error('WebAssembly RuntimeError:', error);
            output.innerHTML += `<div class="error">Runtime Error: ${error.message}</div>`;
        } else {
            output.innerHTML = `<div class="error">Error: ${error.message}</div>`;
        }
            }
        }

        // Альтернативная функция для отладки - показывает все экспорты
        async function debugExports() {
            try {
                const response = await fetch('output.wasm');
                const bytes = await response.arrayBuffer();
                const results = await WebAssembly.instantiate(bytes);
                const instance = results.instance;

                console.log('All exports:');
                for (const key in instance.exports) {
                    console.log(`- ${key}: ${typeof instance.exports[key]}`);
                }
            } catch (error) {
                console.error('Debug error:', error);
            }
        }

        // Запускаем отладку при загрузке страницы
        window.addEventListener('load', debugExports);
    </script>
</body>

</html>
